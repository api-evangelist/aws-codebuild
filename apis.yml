    name: AWS CodeBuild API
    description: >-
      Programmatic interface for managing CodeBuild projects, build runs,
      reports, source credentials, and webhooks. Requests are signed with AWS
      Signature Version 4 and sent to regional CodeBuild endpoints
      (codebuild.<region>.amazonaws.com).
    humanURL: https://docs.aws.amazon.com/codebuild/latest/APIReference/Welcome.html
