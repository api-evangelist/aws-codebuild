aid: aws-codebuild
name: AWS CodeBuild
description: >-
  AWS CodeBuild is a fully managed continuous integration build service that
  compiles source code, runs unit tests, and produces deployable artifacts. It
  eliminates the need to provision, manage, and scale build servers by providing
  prepackaged build environments for popular languages and tools, and scales
  automatically to meet peak build requests. The CodeBuild API uses AWS
  Signature Version 4 (SigV4) authentication and is accessed via SDKs, the AWS
  CLI, or direct HTTPS calls to regional service endpoints.
